<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallpaper Downloader</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        height: 100vh;
        justify-content: center;
        align-items: center;
        background: #f0f0f0;
      }
      button {
        padding: 1em 2em;
        font-size: 1.2em;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      button:hover {
        background: #45a049;
      }
    </style>
  </head>
  <body>
    <button onclick="download()">Download Wallpapers</button>

    <script>
      function download() {
        const a = document.createElement("a");
        a.href = "/download";
        a.click();
      }
    </script>
  </body>
</html>
